# Shared external configuration defaults for local development environment
# Served via Spring Cloud Config Server (native profile)

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Baseline configuration template (credentials must be injected via env variables locally)
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
