server.port=8080

spring.application.name=api-gateway
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://config-server:8800}

spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webflux.routes[1].id=resume-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://resume-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/resumes/**

spring.cloud.gateway.server.webflux.routes[2].id=job-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://job-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/jobs/**

spring.cloud.gateway.server.webflux.routes[3].id=application-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://application-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/applications/**

spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/notifications/**

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
