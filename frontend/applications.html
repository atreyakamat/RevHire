<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidate Applications &mdash; RevHire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h2 class="fw-bold text-dark mb-1">Candidate Applications</h2>
          <p class="text-muted mb-0">Evaluate candidate profiles, review structured resumes, and advance candidates through hiring stages</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <label for="job-filter-select" class="form-label small text-muted mb-0 fw-semibold text-nowrap">Filter Position:</label>
          <select id="job-filter-select" class="form-select form-select-sm" style="min-width: 200px;">
            <option value="">All Posted Jobs</option>
          </select>
        </div>
      </div>

      <div id="alert-placeholder"></div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-0" id="employer-applications-container"></div>
      </div>
    </div>
  </main>

  <!-- Candidate Resume Modal -->
  <div class="modal fade" id="viewResumeModal" tabindex="-1" aria-labelledby="resumeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="resumeModalLabel">
            <i class="bi bi-file-earmark-person me-2 text-primary"></i>Candidate Credentials &amp; Resume
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="view-resume-modal-body">
          <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Loading profile details...</p>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/applications.js"></script>
</body>
</html>
