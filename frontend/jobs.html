<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Jobs &mdash; RevHire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <!-- Page Header -->
      <div class="mb-4">
        <h2 class="fw-bold text-dark mb-1">Browse Job Openings</h2>
        <p class="text-muted mb-0">Discover opportunities across verified hiring organizations</p>
      </div>

      <!-- Filter Controls Card -->
      <div class="card p-4 mb-4 border-0 shadow-sm bg-white">
        <form id="jobs-filter-form" class="row g-3 align-items-end">
          <div class="col-lg-3 col-md-6">
            <label for="filter-keyword" class="form-label small text-muted">Skills / Keyword</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="bi bi-search"></i></span>
              <input type="text" id="filter-keyword" class="form-control" placeholder="e.g. Java, Docker">
            </div>
          </div>

          <div class="col-lg-3 col-md-6">
            <label for="filter-location" class="form-label small text-muted">Location</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="bi bi-geo-alt"></i></span>
              <input type="text" id="filter-location" class="form-control" placeholder="e.g. New York, Remote">
            </div>
          </div>

          <div class="col-lg-2 col-md-4">
            <label for="filter-type" class="form-label small text-muted">Job Type</label>
            <select id="filter-type" class="form-select">
              <option value="">All Types</option>
              <option value="FULL_TIME">Full Time</option>
              <option value="PART_TIME">Part Time</option>
              <option value="CONTRACT">Contract</option>
              <option value="INTERNSHIP">Internship</option>
            </select>
          </div>

          <div class="col-lg-2 col-md-4">
            <label for="filter-salary" class="form-label small text-muted">Min Salary ($)</label>
            <input type="number" id="filter-salary" class="form-control" placeholder="e.g. 50000" min="0" step="5000">
          </div>

          <div class="col-lg-2 col-md-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-filter me-1"></i>Filter
            </button>
            <button type="button" id="btn-reset-filters" class="btn btn-outline-secondary" title="Reset Filters">
              <i class="bi bi-arrow-counterclockwise"></i>
            </button>
          </div>
        </form>
      </div>

      <!-- Results Meta -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span id="jobs-count-text" class="text-muted small">Loading jobs...</span>
      </div>

      <!-- Jobs Grid -->
      <div id="jobs-list-container"></div>

      <!-- Pagination -->
      <div id="jobs-pagination" class="mt-4"></div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/jobs.js"></script>
</body>
</html>
