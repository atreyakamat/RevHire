<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register &mdash; RevHire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-9 col-lg-7">
          <div class="card p-4 p-md-5 shadow-sm border-0">
            <div class="text-center mb-4">
              <a href="index.html" class="d-inline-flex align-items-center text-decoration-none fw-bold text-primary fs-3 mb-2">
                <i class="bi bi-layers-fill me-2"></i>Rev<span class="text-dark">Hire</span>
              </a>
              <h4 class="fw-bold text-dark">Create Your Account</h4>
              <p class="text-muted small">Join RevHire as a candidate looking for jobs or an employer hiring top talent</p>
            </div>

            <div id="register-alert-placeholder"></div>

            <form id="register-form">
              <!-- Role Selection -->
              <div class="mb-4">
                <label class="form-label d-block fw-semibold">Select Account Type</label>
                <div class="row g-2">
                  <div class="col-6">
                    <input type="radio" class="btn-check" name="role" id="role-seeker" value="JOB_SEEKER" checked autocomplete="off">
                    <label class="btn btn-outline-primary w-100 py-2 d-flex flex-column align-items-center" for="role-seeker">
                      <i class="bi bi-person fs-4 mb-1"></i>
                      <span>Job Seeker</span>
                    </label>
                  </div>
                  <div class="col-6">
                    <input type="radio" class="btn-check" name="role" id="role-employer" value="EMPLOYER" autocomplete="off">
                    <label class="btn btn-outline-primary w-100 py-2 d-flex flex-column align-items-center" for="role-employer">
                      <i class="bi bi-building fs-4 mb-1"></i>
                      <span>Employer</span>
                    </label>
                  </div>
                </div>
              </div>

              <!-- Base Credentials -->
              <div class="row g-3 mb-3">
                <div class="col-12">
                  <label for="reg-email" class="form-label">Email Address <span class="text-danger">*</span></label>
                  <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="col-md-6">
                  <label for="reg-password" class="form-label">Password <span class="text-danger">*</span></label>
                  <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 characters" minlength="6" required autocomplete="new-password">
                </div>

                <div class="col-md-6">
                  <label for="reg-confirm-password" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                  <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" minlength="6" required autocomplete="new-password">
                </div>

                <div class="col-12">
                  <label for="reg-phone" class="form-label">Phone Number</label>
                  <input type="tel" id="reg-phone" class="form-control" placeholder="+1 (555) 000-0000">
                </div>
              </div>

              <!-- Job Seeker Fields -->
              <div id="seeker-fields" class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="reg-firstname" class="form-label">First Name</label>
                  <input type="text" id="reg-firstname" class="form-control" placeholder="John">
                </div>
                <div class="col-md-6">
                  <label for="reg-lastname" class="form-label">Last Name</label>
                  <input type="text" id="reg-lastname" class="form-control" placeholder="Doe">
                </div>
                <div class="col-12">
                  <label for="reg-dob" class="form-label">Date of Birth</label>
                  <input type="date" id="reg-dob" class="form-control">
                </div>
              </div>

              <!-- Employer Fields -->
              <div id="employer-fields" class="row g-3 mb-4 d-none">
                <div class="col-md-6">
                  <label for="reg-company" class="form-label">Company Name <span class="text-danger">*</span></label>
                  <input type="text" id="reg-company" class="form-control" placeholder="Acme Technologies Inc.">
                </div>
                <div class="col-md-6">
                  <label for="reg-contact" class="form-label">Contact Person Name</label>
                  <input type="text" id="reg-contact" class="form-control" placeholder="HR Manager / Jane Smith">
                </div>
                <div class="col-12">
                  <label for="reg-website" class="form-label">Company Website</label>
                  <input type="url" id="reg-website" class="form-control" placeholder="https://example.com">
                </div>
              </div>

              <button type="submit" id="register-submit-btn" class="btn btn-primary btn-lg w-100 mb-3 shadow-sm">
                Create Account
              </button>

              <div class="text-center small text-muted">
                Already have an account? <a href="login.html" class="text-decoration-none fw-semibold">Sign in here</a>
              </div>
            </form>
          </div>

          <div class="text-center mt-3">
            <a href="index.html" class="text-decoration-none small text-muted">
              <i class="bi bi-arrow-left me-1"></i>Back to Home
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderNavbar('register');
      UI.renderFooter();

      AUTH.redirectIfLoggedIn();

      // Check query param for default role
      const urlParams = new URLSearchParams(window.location.search);
      const roleParam = urlParams.get('role');
      if (roleParam === 'EMPLOYER') {
        const empRadio = document.getElementById('role-employer');
        if (empRadio) {
          empRadio.checked = true;
          toggleRoleFields('EMPLOYER');
        }
      }

      // Role switcher
      const roleRadios = document.querySelectorAll('input[name="role"]');
      roleRadios.forEach(radio => {
        radio.addEventListener('change', (e) => {
          toggleRoleFields(e.target.value);
        });
      });

      function toggleRoleFields(role) {
        const seekerDiv = document.getElementById('seeker-fields');
        const employerDiv = document.getElementById('employer-fields');
        if (role === 'EMPLOYER') {
          seekerDiv.classList.add('d-none');
          employerDiv.classList.remove('d-none');
        } else {
          seekerDiv.classList.remove('d-none');
          employerDiv.classList.add('d-none');
        }
      }

      // Form submission
      const form = document.getElementById('register-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        UI.clearAlert('register-alert-placeholder');

        const role = document.querySelector('input[name="role"]:checked')?.value || 'JOB_SEEKER';
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmPassword = document.getElementById('reg-confirm-password').value;
        const phone = document.getElementById('reg-phone').value.trim() || null;

        if (password.length < 6) {
          UI.showAlert('register-alert-placeholder', 'Password must be at least 6 characters long.', 'warning');
          return;
        }

        if (password !== confirmPassword) {
          UI.showAlert('register-alert-placeholder', 'Passwords do not match.', 'warning');
          return;
        }

        const payload = {
          email,
          password,
          role,
          phone
        };

        if (role === 'JOB_SEEKER') {
          payload.firstName = document.getElementById('reg-firstname')?.value?.trim() || null;
          payload.lastName = document.getElementById('reg-lastname')?.value?.trim() || null;
          payload.dateOfBirth = document.getElementById('reg-dob')?.value || null;
        } else if (role === 'EMPLOYER') {
          const companyName = document.getElementById('reg-company')?.value?.trim();
          if (!companyName) {
            UI.showAlert('register-alert-placeholder', 'Company Name is required for employer registration.', 'warning');
            return;
          }
          payload.companyName = companyName;
          payload.contactName = document.getElementById('reg-contact')?.value?.trim() || null;
          payload.website = document.getElementById('reg-website')?.value?.trim() || null;
        }

        const submitBtn = document.getElementById('register-submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Creating account...';

        try {
          await API.post(CONFIG.ENDPOINTS.AUTH.REGISTER, payload);
          // Redirect to login page with registered notice
          window.location.href = 'login.html?registered=true';
        } catch (err) {
          console.error('Registration error:', err);
          UI.showAlert('register-alert-placeholder', err.message || 'Registration failed. Please check your information.', 'danger');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>
