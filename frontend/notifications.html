<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications &mdash; RevHire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <!-- Page Header -->
          <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
              <div class="d-flex align-items-center gap-2">
                <h2 class="fw-bold text-dark mb-0">Notifications Inbox</h2>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle" id="unread-count-text">0 unread</span>
              </div>
              <p class="text-muted small mt-1 mb-0">Live alerts for application progress, job postings, and account activities</p>
            </div>
            <div>
              <button type="button" id="mark-all-read-btn" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-check2-all me-1"></i>Mark All as Read
              </button>
            </div>
          </div>

          <div id="notif-alert-placeholder"></div>

          <!-- Notifications List Container -->
          <div id="notifications-list-container"></div>

          <!-- Pagination -->
          <div id="notifications-pagination"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
