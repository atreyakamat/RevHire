<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Job &mdash; RevHire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card p-4 p-md-5 border-0 shadow-sm">
            <div class="mb-4">
              <h3 class="fw-bold text-dark mb-1" id="page-title">Post a New Job Opening</h3>
              <p class="text-muted small mb-0" id="page-subtitle">Publish a job vacancy to attract qualified applicants from the RevHire network</p>
            </div>

            <div id="form-alert-placeholder"></div>

            <form id="job-form">
              <div class="mb-3">
                <label for="job-title" class="form-label">Job Title <span class="text-danger">*</span></label>
                <input type="text" id="job-title" class="form-control" placeholder="e.g. Senior Java Backend Engineer" required>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="job-location" class="form-label">Job Location <span class="text-danger">*</span></label>
                  <input type="text" id="job-location" class="form-control" placeholder="e.g. San Francisco, CA or Remote" required>
                </div>
                <div class="col-md-6">
                  <label for="job-type" class="form-label">Employment Type <span class="text-danger">*</span></label>
                  <select id="job-type" class="form-select" required>
                    <option value="FULL_TIME">Full Time</option>
                    <option value="PART_TIME">Part Time</option>
                    <option value="CONTRACT">Contract</option>
                    <option value="INTERNSHIP">Internship</option>
                  </select>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="job-salary" class="form-label">Annual Salary / Compensation ($) <span class="text-danger">*</span></label>
                  <input type="number" id="job-salary" class="form-control" placeholder="e.g. 120000" min="0" step="1000" required>
                </div>
                <div class="col-md-6">
                  <label for="job-skills" class="form-label">Required Skills (Comma separated) <span class="text-danger">*</span></label>
                  <input type="text" id="job-skills" class="form-control" placeholder="e.g. Java, Spring Boot, MySQL, Docker" required>
                </div>
              </div>

              <!-- Status only visible when editing existing job -->
              <div id="status-container" class="mb-3 d-none">
                <label for="job-status" class="form-label">Listing Status <span class="text-danger">*</span></label>
                <select id="job-status" class="form-select">
                  <option value="ACTIVE">Active (Accepting Applications)</option>
                  <option value="DRAFT">Draft (Hidden from Browse)</option>
                  <option value="CLOSED">Closed (Archived)</option>
                </select>
              </div>

              <div class="mb-4">
                <label for="job-description" class="form-label">Comprehensive Description &amp; Responsibilities <span class="text-danger">*</span></label>
                <textarea id="job-description" class="form-control" rows="6" placeholder="Provide complete position overview, daily responsibilities, required qualifications, and company perks..." required></textarea>
              </div>

              <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                <a href="manage-jobs.html" class="btn btn-outline-secondary">
                  <i class="bi bi-arrow-left me-1"></i>Cancel
                </a>
                <button type="submit" id="submit-job-btn" class="btn btn-primary px-4 shadow-sm">
                  <i class="bi bi-plus-circle me-1"></i>Publish Job Opening
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/post-job.js"></script>
</body>
</html>
