<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Profile &mdash; RevHire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <!-- Profile Card -->
          <div class="card p-4 p-md-5 border-0 shadow-sm">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-3 border-bottom gap-2">
              <div class="d-flex align-items-center gap-3">
                <div class="bg-primary text-white rounded-circle p-3 d-flex align-items-center justify-content-center" style="width: 55px; height: 55px;">
                  <i class="bi bi-person-fill fs-3"></i>
                </div>
                <div>
                  <h4 class="fw-bold text-dark mb-0" id="profile-email">Loading email...</h4>
                  <small class="text-muted" id="profile-user-id">ID: -</small>
                </div>
              </div>
              <div>
                <span class="badge bg-primary px-3 py-2 text-uppercase" id="profile-role-badge">Role</span>
              </div>
            </div>

            <div id="profile-alert-placeholder"></div>

            <form id="profile-form">
              <!-- Common Phone Field -->
              <div class="mb-3">
                <label for="profile-phone" class="form-label">Phone Number</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted"><i class="bi bi-telephone"></i></span>
                  <input type="tel" id="profile-phone" class="form-control" placeholder="+1 (555) 000-0000">
                </div>
              </div>

              <!-- Seeker Specific Fields -->
              <div id="seeker-fields" class="row g-3 mb-3 d-none">
                <div class="col-md-6">
                  <label for="profile-firstname" class="form-label">First Name</label>
                  <input type="text" id="profile-firstname" class="form-control" placeholder="First Name">
                </div>
                <div class="col-md-6">
                  <label for="profile-lastname" class="form-label">Last Name</label>
                  <input type="text" id="profile-lastname" class="form-control" placeholder="Last Name">
                </div>
                <div class="col-12">
                  <label for="profile-dob" class="form-label">Date of Birth</label>
                  <input type="date" id="profile-dob" class="form-control">
                </div>
              </div>

              <!-- Employer Specific Fields -->
              <div id="employer-fields" class="row g-3 mb-3 d-none">
                <div class="col-md-6">
                  <label for="profile-company" class="form-label">Company Name</label>
                  <input type="text" id="profile-company" class="form-control" placeholder="Company Name">
                </div>
                <div class="col-md-6">
                  <label for="profile-contact" class="form-label">Contact Person</label>
                  <input type="text" id="profile-contact" class="form-control" placeholder="Primary Contact Name">
                </div>
                <div class="col-12">
                  <label for="profile-website" class="form-label">Company Website</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-globe"></i></span>
                    <input type="url" id="profile-website" class="form-control" placeholder="https://example.com">
                  </div>
                </div>
              </div>

              <div class="pt-3 border-top text-end">
                <button type="submit" id="save-profile-btn" class="btn btn-primary px-4 shadow-sm">
                  <i class="bi bi-check2-circle me-1"></i>Save Profile Changes
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
