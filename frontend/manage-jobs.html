<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Jobs &mdash; RevHire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div>
          <h2 class="fw-bold text-dark mb-1">Manage Posted Positions</h2>
          <p class="text-muted mb-0">Review, update, or remove job listings posted by your organization</p>
        </div>
        <div>
          <a href="post-job.html" class="btn btn-primary shadow-sm">
            <i class="bi bi-plus-circle me-2"></i>Post New Job
          </a>
        </div>
      </div>

      <div id="manage-alert-placeholder"></div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-0" id="employer-jobs-container"></div>
      </div>
    </div>
  </main>

  <!-- Delete Job Confirmation Modal -->
  <div class="modal fade" id="deleteJobModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header">
          <h5 class="modal-title fw-bold text-danger" id="deleteModalLabel"><i class="bi bi-exclamation-triangle me-2"></i>Confirm Job Deletion</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="text-secondary mb-2">Are you sure you want to permanently delete this job listing?</p>
          <div class="p-3 bg-light rounded border fw-semibold text-dark" id="delete-job-title">Job Title</div>
          <p class="small text-muted mt-2 mb-0">This action cannot be undone. Associated applications may also be permanently affected.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="confirm-delete-job-btn" class="btn btn-danger" onclick="executeDeleteJob()">
            Delete Job
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/jobs.js"></script>
</body>
</html>
