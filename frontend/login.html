<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &mdash; RevHire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <div class="card p-4 p-md-5 shadow-sm border-0">
            <div class="text-center mb-4">
              <a href="index.html" class="d-inline-flex align-items-center text-decoration-none fw-bold text-primary fs-3 mb-2">
                <i class="bi bi-layers-fill me-2"></i>Rev<span class="text-dark">Hire</span>
              </a>
              <h4 class="fw-bold text-dark">Welcome Back</h4>
              <p class="text-muted small">Sign in to manage your career or recruitment pipeline</p>
            </div>

            <div id="login-alert-placeholder"></div>

            <form id="login-form">
              <div class="mb-3">
                <label for="login-email" class="form-label">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
                </div>
              </div>

              <div class="mb-4">
                <div class="d-flex justify-content-between">
                  <label for="login-password" class="form-label">Password</label>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                  <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                  <button type="button" class="btn btn-outline-secondary" id="toggle-password-btn" aria-label="Toggle password visibility">
                    <i class="bi bi-eye" id="toggle-password-icon"></i>
                  </button>
                </div>
              </div>

              <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg w-100 mb-3 shadow-sm">
                Sign In
              </button>

              <div class="text-center small text-muted">
                Don't have an account? <a href="register.html" class="text-decoration-none fw-semibold">Register here</a>
              </div>
            </form>
          </div>

          <div class="text-center mt-3">
            <a href="index.html" class="text-decoration-none small text-muted">
              <i class="bi bi-arrow-left me-1"></i>Back to Home
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      UI.renderNavbar('login');
      UI.renderFooter();

      // If user is already logged in, redirect
      AUTH.redirectIfLoggedIn();

      // Check URL parameters for status notices
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('registered') === 'true') {
        UI.showAlert('login-alert-placeholder', 'Account registered successfully! Please log in with your credentials.', 'success');
      } else if (urlParams.get('expired') === 'true') {
        UI.showAlert('login-alert-placeholder', 'Your session has expired. Please sign in again.', 'warning');
      }

      // Password toggle
      const toggleBtn = document.getElementById('toggle-password-btn');
      const passwordInput = document.getElementById('login-password');
      const toggleIcon = document.getElementById('toggle-password-icon');

      if (toggleBtn && passwordInput && toggleIcon) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          toggleIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });
      }

      // Login form submission
      const form = document.getElementById('login-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        UI.clearAlert('login-alert-placeholder');

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        if (!email || !password) {
          UI.showAlert('login-alert-placeholder', 'Email and password are required.', 'warning');
          return;
        }

        const submitBtn = document.getElementById('login-submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Signing in...';

        try {
          const authData = await API.post(CONFIG.ENDPOINTS.AUTH.LOGIN, { email, password });
          AUTH.setAuth(authData, email);

          // Handle redirect
          const redirectParam = urlParams.get('redirect');
          if (redirectParam && !redirectParam.includes('login') && !redirectParam.includes('register')) {
            window.location.href = redirectParam;
          } else if (authData.role === 'EMPLOYER') {
            window.location.href = 'employer-dashboard.html';
          } else {
            window.location.href = 'seeker-dashboard.html';
          }
        } catch (err) {
          console.error('Login error:', err);
          UI.showAlert('login-alert-placeholder', err.message || 'Invalid email or password.', 'danger');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
